<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180">
  <defs>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#caa86a"/>
      <stop offset="100%" stop-color="#b78a45"/>
    </linearGradient>
  </defs>
  <rect width="420" height="180" fill="#ffffff"/>
  <!-- wreath arc -->
  <path d="M80,30 C130,10 220,10 290,48" stroke="url(#gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- laurel leaves -->
  <g transform="translate(70,28)" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
    <path d="M10 10 q10 -8 18 -4"/>
    <path d="M18 16 q10 -8 18 -4"/>
    <path d="M26 22 q10 -8 18 -4"/>
  </g>
  <!-- RP monogram -->
  <text x="120" y="120" font-family="Times New Roman, serif" font-size="72" fill="#0f2038">R</text>
  <text x="170" y="120" font-family="Times New Roman, serif" font-size="72" fill="#0f2038">P</text>
  <!-- company name -->
  <text x="120" y="155" font-family="Arial, Noto Sans KR, sans-serif" font-size="20" fill="#0f2038">R.Partner</text>
  <text x="120" y="175" font-family="Arial, Noto Sans KR, sans-serif" font-size="12" fill="#b78a45">WEDDING RECEPTION MANAGEMENT</text>
</svg>
